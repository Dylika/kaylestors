title: "Kaylestore"
description: "Emotional real-life stories, a daily serial, and practical guides for everyday life."
tagline: "Stories that stay with you"
brand_first: "Kayle"
brand_second: "store"
series_title: "The Ledger in the Attic"

# Menu bar (match: highlight the item on posts that have this front-matter key)
nav:
  - { title: Home, url: / }
  - { title: Life Stories, url: /stories/ }
  - { title: "The Ledger in the Attic", url: /series/, match: series_id }
  - { title: Articles, url: /articles/ }
  - { title: About, url: /about/ }

# Your Facebook page URL; shows a "Find us on Facebook" box in the sidebar when set.
facebook_page:
author: ""
url: "https://kaylestore.onrender.com"  # switch to https://kaylestore.net once the domain points to Render and is added in Adskeeper
baseurl: ""
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
permalink: /:year/:month/:day/:title/

# Google Analytics 4 measurement ID (remove to turn tracking off).
google_analytics_id: G-12CQ98Q2P7

# Adskeeper (only serves on domains added to your Adskeeper dashboard).
# Remove an ID to hide that widget.
ads:
  adskeeper_site: "1114554"
  in_article_widget: "2091494"     # visible inside the article, after paragraph 3
  in_article_after: 3              # must be <= read_more.intro_paragraphs so it is never clipped
  read_more_widget: "2091495"      # loads only when "Read Full Story" is clicked, at the start of
                                   # the revealed text (end of article on short posts)
  under_article_widget:            # optional extra widget at the bottom of every post
  sidebar_widget:                  # optional widget in the sidebar "Advertisement" box
  header_widget:                   # optional banner widget next to the logo

# Longer posts show their opening and a "Read Full Story" button that expands the rest.
read_more:
  enabled: true
  min_words: 400      # shorter posts are always shown in full
  intro_paragraphs: 5 # fully visible opening before the faded preview and the button

# Shows a one-line note under each post that it was written with AI assistance.
ai_disclosure: true

exclude:
  - pipeline
  - topics.txt
  - README.md
  - render.yaml
  - social
  - .github
