# Writer settings used by pipeline/generate.py
model: claude-opus-5-5
effort: high            # low | medium | high | xhigh | max — higher = better research, more cost
audience: "curious general readers"
style: "friendly, clear and practical; concrete examples over generalities"
min_words: 900
max_words: 1500
max_searches: 8         # web searches allowed per article

# Stories (original fiction, no web research)
story_min_words: 2200   # matched to kaylestore.net's typical story length (~2,700 words)
story_max_words: 3200

# Recent titles from this WordPress site guide the themes of auto-picked topics (never the plots).
inspiration_site: https://kaylestore.net

# Auto topics: when topics.txt has fewer items than a run needs, Claude invents new ones.
auto_topics: true
auto_topics_batch: 6    # how many to add at a time
story_share: 0.5        # fraction of auto topics that are stories (rest are articles)

# Grammar checking (LanguageTool's free public API; swap in your own server if you hit limits)
# Serialized story: one ongoing fiction series, published episode by episode.
# Progress (current episode, outline, summaries, image prompts) lives in pipeline/series/<name>/.
series:
  enabled: true
  episodes: 50
  per_run: 1            # episodes published per daily run
  auto_start: true      # when a series finishes (or none exists), plan a new one
  min_words: 1500
  max_words: 2200

grammar_passes: 2       # check -> fix rounds before publishing; no check = no publish
language: en-US
languagetool_url: https://api.languagetool.org/v2/check

# Address used in Facebook links (pipeline/social.py). Switch to https://kaylestore.net
# once the domain points to Render.
public_url: https://kaylestore.onrender.com
