title: The Ledger in the Attic
slug: the-ledger-in-the-attic
logline: When her grandmother leaves her everything, a hospice nurse uncovers a 40-year ledger of secret
  payments, a brother she never knew she had, and an uncle who will do anything to take it all back.
total_episodes: 50
next_episode: 2
bible: 'NARRATOR: Nora Bishop, 38. Hospice nurse in Ashford, Ohio (fictional small town). Divorced, practical,

  stubborn, dark hair usually in a messy bun, tired green eyes, wears her grandmother''s thin gold watch.

  Cared for her grandmother for the last three years. Secret: she quietly paid Evelyn''s property taxes

  for three years so Evelyn wouldn''t worry.


  Lily Bishop, 12. Nora''s daughter. Curly brown hair, glasses, always filming things on her phone for

  "projects". Observant and brave.


  Evelyn Mercer (deceased at 89). Nora''s grandmother. Founded Mercer Hardware on Main Street in 1968
  and

  owned the family lake house at Pine Hollow Lake. Silver bob, knitted constantly, wrote in a private

  knitting shorthand, signed every letter with a tiny cross-stitch "x" after her name. Loved white

  lilies and butterscotch candies.


  Diane Mercer-Bishop, 62. Nora''s mother. Elegant, image-conscious, sharp-tongued, blonde-silver hair,

  pearls. Secret: at 17 (1981) she gave birth to a son whom Evelyn forced her to give up for adoption.

  She has quietly searched for him for 40 years. She wrote the final ledger entry after Evelyn''s death,

  intending to continue the payments herself.


  Ray Mercer, 58. Nora''s uncle, Diane''s younger brother. Charming, heavy-set, gambling debts. Ran the

  hardware store''s books. Took a $280,000 loan from Dale Whitcomb using the store as collateral; the

  loan papers carry a forged "Evelyn Mercer" signature. Pushed a medication change to keep Evelyn

  confused. Later sets the store on fire for insurance. Has no children.


  Celeste Mercer, 55. Ray''s wife. Polished, social climber, wants the lake house sold. She physically

  forged Evelyn''s signature (at Ray''s urging) and picked up the changed medication. Her niece, Brianna,

  works in hospice records and deletes Nora''s notes.


  Marcus Hale, 44. Carpenter with a small shop in Fenwick, 30 minutes away. Tall, calm, gray-flecked

  beard, sawdust on his jacket. Diane''s son, adopted by the Hale family; Nora''s half-brother. Evelyn

  found him in 1984 and paid $400 a month ("M.H." in the ledger) toward his upbringing and schooling,

  then kept in touch secretly. He knew Evelyn as "Mrs. M".


  Owen Pratt, 67. Evelyn''s lawyer and confidant. Bow ties, butterscotch bowl on his desk.

  June Alvarez, 80. Evelyn''s best friend; kept Evelyn''s letters; can read her knitting shorthand.

  Dale Whitcomb, 60. Land developer who wants Pine Hollow Lake land. Drives a gray truck. Lends money
  to

  desperate people and takes their property.

  Tully Brooks, 50s. Whitcomb''s foreman; once fired by Marcus.

  Greg Bishop, 40. Nora''s ex-husband. Once unreliable, now trying to be a better father.


  CENTRAL CONFLICT: Evelyn''s will leaves the store and lake house to Nora. Ray and Celeste contest it
  to

  cover the forged loan before Whitcomb calls it in. The ledger and Evelyn''s letters slowly reveal the

  family''s secrets.


  ENDING: The will is upheld, the forged loan is voided, Ray faces charges, Celeste testifies. Evelyn''s

  final letter (addressed "To Nora and Marcus") asks them to share the lake house and asks Diane to

  forgive herself. Diane survives a heart attack. Nora and Marcus reopen Mercer Hardware together, and

  Diane and Marcus begin a real relationship as mother and son.

  '
outline:
- n: 1
  title: The Will
  plan: 'At Evelyn''s will reading, Nora learns she inherits the store and the lake house, and her mother
    and Uncle Ray explode. Cliffhanger: Owen hands Nora a sealed envelope in Evelyn''s handwriting marked
    ''Only after they''ve shown you who they are.'''
- n: 2
  title: The Envelope
  plan: 'The envelope holds an attic key and one line: ''Find the ledger before Ray does.'' Cliffhanger:
    that night Nora hears someone inside Evelyn''s house and finds fresh scratches on the attic lock.'
- n: 3
  title: The Ledger
  plan: 'In the attic Nora finds a ledger of $400 monthly payments to ''M.H.'' since 1984. Cliffhanger:
    the last entry is dated two days after Evelyn died, in different handwriting.'
- n: 4
  title: The Stranger at the Grave
  plan: 'At the grave Nora finds a man leaving white lilies. He says his name is Marcus Hale and that
    Evelyn was ''Mrs. M'' to him. Cliffhanger: he leaves before she can ask more, dropping a photo of
    a young Diane holding a baby.'
- n: 5
  title: Uncle Ray's Offer
  plan: 'Ray offers to take the store off Nora''s hands for a suspiciously low price and warns her to
    stop digging. Cliffhanger: Lily shows a photo she took of Ray''s car outside Evelyn''s house on the
    night of the break-in.'
- n: 6
  title: The Carpenter
  plan: 'Nora tracks Marcus to his shop in Fenwick. He admits Evelyn paid for his schooling for decades.
    Cliffhanger: he says, ''Ask your mother why,'' and closes the door.'
- n: 7
  title: Diane's Silence
  plan: 'Nora confronts Diane, who goes pale and throws her out. Cliffhanger: through the window Nora
    hears Diane call Ray: ''She found him.'''
- n: 8
  title: The Contest
  plan: 'Ray and Celeste file to contest the will, claiming Evelyn had dementia and Nora manipulated her.
    Cliffhanger: their lawyer subpoenas Nora''s hospice records.'
- n: 9
  title: June's Letters
  plan: 'June gives Nora a box of letters Evelyn asked her to keep. Cliffhanger: the first letter mentions
    ''the boy we sent away in ''81.'''
- n: 10
  title: '1981'
  plan: 'The letters reveal Diane got pregnant at 17 and Evelyn forced an adoption. Cliffhanger: the adoptive
    family''s name was Hale.'
- n: 11
  title: Brother
  plan: 'Nora realizes Marcus is her half-brother and drives to Fenwick. Cliffhanger: his shop is locked
    and a For Sale sign is up.'
- n: 12
  title: Gone
  plan: 'Marcus has vanished; a neighbor says a man in a gray truck came asking for him. Cliffhanger:
    Nora sees the same gray truck parked outside Mercer Hardware: it belongs to Dale Whitcomb.'
- n: 13
  title: The Developer
  plan: 'Whitcomb offers far above value for the lake land. Cliffhanger: he mentions a loan agreement
    ''your uncle signed on the store''s behalf.'''
- n: 14
  title: The Loan
  plan: 'Nora finds Ray took a $280,000 loan from Whitcomb with the store as collateral, signed ''Evelyn
    Mercer.'' Cliffhanger: the signature date falls in a week Evelyn was in hospital under Nora''s own
    care.'
- n: 15
  title: Missing Notes
  plan: 'Nora searches her hospice notes to prove Evelyn could not have signed. Cliffhanger: every note
    from that week has been deleted from the system.'
- n: 16
  title: Inside Job
  plan: 'Nora learns Celeste''s niece Brianna works in hospice records. Cliffhanger: Nora is suspended
    pending an investigation into her care of Evelyn.'
- n: 17
  title: Lily's Question
  plan: 'Lily asks if they''ll lose everything; Greg offers help and Nora reluctantly accepts. Cliffhanger:
    Greg admits Ray called him last month asking about Nora''s finances.'
- n: 18
  title: Marcus Returns
  plan: 'Marcus turns up at the lake house in the rain, bruised, saying Whitcomb''s men pressured him
    to sign away ''a claim he didn''t know he had.'' Cliffhanger: he hands Nora a key identical to her
    attic key.'
- n: 19
  title: The Claim
  plan: 'Owen explains an earlier will named Marcus a beneficiary, and Ray could use him to break the
    current will. Cliffhanger: Marcus receives a letter offering $50,000 to testify that Nora coerced
    Evelyn.'
- n: 20
  title: The Price
  plan: 'Marcus refuses the bribe but asks for one thing: to meet his mother. Cliffhanger: Nora calls
    Diane and Diane answers, ''Tell him the lake. Saturday. Sunrise.'''
- n: 21
  title: Sunrise at the Lake
  plan: 'Nora and Marcus wait at the lake; Diane doesn''t come and Ray does. Cliffhanger: Ray says, ''You
    think he''s the only secret Mom paid for?'''
- n: 22
  title: The Second Column
  plan: 'The ledger has a coded second column; June recognizes Evelyn''s knitting shorthand. Cliffhanger:
    decoded, it gives a safety deposit box number.'
- n: 23
  title: Two Keys
  plan: 'The box needs two keys and Nora has one. Cliffhanger: the clerk says another family member asked
    about the box yesterday: Diane.'
- n: 24
  title: Diane's Story
  plan: 'Diane finally tells the full story of 1981 and her 40-year search, and admits she wrote the last
    ledger entry. Cliffhanger: she gave Ray her key to the box in exchange for his silence.'
- n: 25
  title: The Empty Box
  plan: 'Nora and Diane race to the bank; the box has been emptied. Cliffhanger: tucked in the lining
    is a cassette tape Ray missed.'
- n: 26
  title: Evelyn's Voice
  plan: 'The tape is Evelyn''s recorded confession and wishes from 2019. Cliffhanger: ''If anything happens
    to me suddenly, look at Raymond.'''
- n: 27
  title: The Prescription
  plan: 'Nora reviews Evelyn''s last weeks and finds a medication change she never ordered. Cliffhanger:
    the pharmacy log shows Celeste picked it up.'
- n: 28
  title: The Night Visitor
  plan: 'A night nurse remembers a visitor who stayed past hours in Evelyn''s room. Cliffhanger: she describes
    Ray, carrying a folder of papers.'
- n: 29
  title: Celeste
  plan: 'Nora confronts Celeste, who blames Ray for the medication. Cliffhanger: Celeste admits the forged
    signature was hers, not Ray''s.'
- n: 30
  title: Halfway
  plan: 'Nora, Marcus, Diane and Owen plan their case, but Owen warns the tape may not be admissible.
    Cliffhanger: the lake house is broken into and the tape is stolen.'
- n: 31
  title: Copies
  plan: 'Lily reveals she digitized the tape on her phone for a ''school project.'' Cliffhanger: Lily
    receives an anonymous message: ''Delete it.'''
- n: 32
  title: Protecting Lily
  plan: 'Nora sends Lily to Greg''s, and Greg installs cameras and proves himself. Cliffhanger: footage
    shows Whitcomb''s foreman at Nora''s house at 3 a.m.'
- n: 33
  title: The Foreman
  plan: 'Marcus recognizes the foreman, Tully Brooks, as a man he once fired, and goes to confront him
    alone. Cliffhanger: Marcus doesn''t come home that night.'
- n: 34
  title: Search
  plan: 'Nora and Diane search for Marcus, and Diane shows a fierce protectiveness. Cliffhanger: they
    find his truck at the lake''s old boathouse, door open.'
- n: 35
  title: The Boathouse
  plan: 'They find Marcus tied up but alive; Tully says Ray paid him. Cliffhanger: Tully says Ray plans
    to burn the hardware store tonight for the insurance.'
- n: 36
  title: Fire
  plan: 'Nora races to the store as smoke rises and runs in to save Evelyn''s archive. Cliffhanger: the
    back door slams shut behind her.'
- n: 37
  title: Smoke
  plan: 'Firefighters and Marcus pull Nora out and part of the archive is saved. Cliffhanger: Ray is found
    at the scene, injured, claiming he tried to stop the fire.'
- n: 38
  title: Ray's Version
  plan: 'In hospital, Ray blames Whitcomb and almost convinces Nora. Cliffhanger: she notices the burns
    on his hands match someone who lit the fire, not fought it.'
- n: 39
  title: The Hearing
  plan: 'The will contest hearing begins and Ray''s lawyer paints Nora as a manipulator. Cliffhanger:
    they call Diane as their witness.'
- n: 40
  title: Diane Testifies
  plan: 'On the stand Diane turns, revealing the adoption, the payments and Ray''s blackmail. Cliffhanger:
    Ray''s lawyer produces a letter supposedly from Evelyn disinheriting Nora.'
- n: 41
  title: The Signature
  plan: 'The letter looks real; Nora and June study it overnight. Cliffhanger: June notices it lacks Evelyn''s
    tiny cross-stitch ''x'' after her name.'
- n: 42
  title: Evidence
  plan: 'A handwriting expert testifies and Lily''s recording is admitted. Cliffhanger: Celeste asks to
    speak to Nora alone, offering a deal.'
- n: 43
  title: Celeste's Deal
  plan: 'Celeste offers to testify about the forgery in exchange for immunity and the lake house; Nora
    refuses the house but backs her immunity. Cliffhanger: Celeste whispers that Whitcomb has ''a second
    copy of everything.'''
- n: 44
  title: Verdict
  plan: 'The judge upholds Evelyn''s will and Ray faces fraud charges. Cliffhanger: Whitcomb calls in
    the loan: $280,000 in 30 days or the store is his.'
- n: 45
  title: Thirty Days
  plan: 'Nora, Marcus and the town rally with a sale, carpentry jobs and Greg''s help, but they''re $60,000
    short. Cliffhanger: Diane arrives with a check; she has sold her own house.'
- n: 46
  title: What Mothers Do
  plan: 'Diane says she wants to finally do something right; Nora and Marcus refuse to let her lose her
    home. Cliffhanger: Owen finds the forged loan was never legally binding.'
- n: 47
  title: Whitcomb's Fall
  plan: 'With Celeste''s testimony the loan is voided and Whitcomb''s past fraud exposed. Cliffhanger:
    Ray, out on bail, asks to see Nora alone at the lake.'
- n: 48
  title: The Last Letter
  plan: 'A broken Ray confesses everything and hands over Evelyn''s final letter he stole from the box.
    Cliffhanger: it is addressed ''To Nora and Marcus.'''
- n: 49
  title: My Grandchildren
  plan: 'The letter asks Nora and Marcus to share the lake house and asks Diane to forgive herself. Cliffhanger:
    Diane collapses with a heart attack.'
- n: 50
  title: Home
  plan: 'Diane survives. On Evelyn''s birthday the family gathers at the lake house; Nora and Marcus reopen
    Mercer Hardware together, and Diane and Marcus begin again as mother and son. Final episode: resolve
    everything.'
episodes:
- n: 1
  title: The Will
  file: 2026-10-04-the-ledger-in-the-attic-episode-1.md
  summary: 'At Evelyn Mercer''s will reading in Owen Pratt''s office, Nora learns she inherits Mercer
    Hardware and the Pine Hollow Lake house. Uncle Ray accuses her of manipulating a confused Evelyn and
    storms out with Celeste, who threatens a lawyer; Ray warns Nora "it''s not going to last." Diane accuses
    Nora of wanting to be Evelyn''s favorite and leaves coldly. Nora offers to give everything up, but
    Owen refuses: Evelyn predicted the family''s reactions exactly. He gives Nora a wax-sealed envelope
    in Evelyn''s handwriting marked "Only after they''ve shown you who they are", heavy with something
    small and hard inside, plus a butterscotch candy, and Evelyn''s warning not to open it at the house
    because someone will be watching. Cliffhanger: a gray pickup truck idles in the parking lot, its driver
    staring at Nora through the office window.'
