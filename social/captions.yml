after-51-years-of-marriage-my-husband-left-his-life-insuranc:
  caption: |
    "I'm sorry, ma'am. The sole beneficiary is a Holly Brennan."

    Eleven days after my husband's funeral, the insurance company called. 51 years of marriage, and I had never heard that name. 💔

    My granddaughter found her picture online in four minutes. Freckles. A little gap between her front teeth.

    I knew that smile. I'd known it my whole life. It was my baby sister's smile. And the eyes looking out of that photo were my husband's. 😢

