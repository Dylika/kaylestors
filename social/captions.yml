my-daughter-told-a-judge-i-was-too-confused-to-keep-my-own-h:
  caption: |
    "Love sometimes means making hard decisions for the people who can no longer make them for themselves," my daughter's lawyer told the judge.

    Across the aisle, my daughter dabbed her eyes. She hadn't looked at me once. ⚖️

    For months I'd been finding the stove left on and my keys in the freezer. Adult Protective Services came to my door. I truly thought I was losing my mind.

    Then I remembered the little camera my grandson put on my bookshelf to watch my old cat. 📹

