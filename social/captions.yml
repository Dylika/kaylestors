my-dad-swore-he-was-retired-and-sleeping-fine-until-my-first:
  caption: |
    My dad swore he was retired. He said he was sleeping fine. He said Mom's life insurance was paying off my nursing school loans. 🩺

    Then, in my very first week as a nurse, at 3:12 a.m., a janitor pushed his cart into the room I was cleaning.

    I recognized the boots before I saw his face: brown work boots with silver duct tape across the toe.

    It was my father. And that was only the beginning of what he'd been hiding. 💔

