the-ledger-in-the-attic-episode-2:
  caption: |
    📖 The Ledger in the Attic (Episode 2 of 50)

    Inside Grandma's sealed envelope: an old brass key tied with yellow yarn, and a letter.
    "Find the ledger before Ray does."

    I meant to wait until morning. Instead, at 9:30 p.m., I drove to her dark lake house and left my daughter locked in the car. 🔑

    The lights wouldn't turn on. Then I heard the third stair to the attic creak. Someone was already inside. 😨

    Episode 2 is in the comments 👇
