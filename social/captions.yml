the-ledger-in-the-attic-episode-1:
  caption: |
    📖 NEW SERIES: The Ledger in the Attic (Episode 1 of 50)

    Grandma left me everything: the hardware store, the lake house, all of it. My uncle called me a manipulator. My mother said I always wanted to be her favorite.

    Then her lawyer handed me a sealed envelope in her handwriting:
    "Only after they've shown you who they are."

    And outside the window, a gray truck was waiting. Someone was watching me. 👀

    Episode 1 is in the comments 👇 New episodes every day.
  comment: |
    👉 Episode 1, "The Will": {link}

i-paid-for-a-lonely-old-man-s-coffee-for-a-year-and-got-fire:
  caption: |
    Every morning at 7:40, Mr. Vance counted out his coffee money coin by coin. ☕

    When my manager raised the prices overnight, he came up thirty cents short, and he apologized to the coins before he apologized to me.

    So I started quietly covering the difference. For a whole year. Until the day my boss found out and fired me for it.

    I thought that was the end of the story. Then I went to Mr. Vance's funeral, and a lawyer pulled me aside. 🥹

