my-husband-left-our-lake-cabin-to-a-woman-i-d-never-heard-of:
  caption: |
    "To Danielle Price, I leave the cabin on Indian Lake."

    Forty-eight years of marriage, and I had never once heard my husband say that name. 💔

    At our cabin, behind his fishing waders, I found a photo album full of her life. Her graduation. Her wedding. Her laughing on OUR dock with Frank's arm around her.

    The lawyer would only tell me one thing: "Ask Carol." My sister. So I did. She opened the album to the first page and said, "Look at her. Really look at her. Look at her eyes." 😢

