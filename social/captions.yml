my-sister-and-i-were-ready-to-sue-each-other-over-mom-s-hous:
  caption: |
    "Don't touch anything. I've photographed every room."

    That's what my sister said to me three weeks after Mom's funeral. We hadn't spoken in two years, and now we were about to take each other to court over the house we grew up in. 🏠

    Then, while sorting Mom's pantry, I found her old recipe box. It was locked.

    What was inside changed everything we thought we knew about our mother, and about each other. 💌

