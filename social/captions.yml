for-11-years-my-brother-in-law-called-me-the-help-at-family:
  caption: |
    "Look at that. Ben brought home a girlfriend AND the help." 😶

    That was the first thing my brother-in-law ever said about me. Everyone laughed, so I laughed too.

    For 11 years, "Help" was my name at every Sunday dinner. Then his restaurant loan got denied at the bank where I work, and he stood up in front of the whole family and accused me of sabotaging him.

    I was halfway out the door with my coat on when his wife finally spoke up. What she said left the entire table silent. 💔

