the-bank-manager-laughed-at-my-check-and-had-security-walk-m:
  caption: |
    "Ma'am, people like you don't have this kind of money."

    The bank manager held my check up between two fingers and laughed, loud enough for the whole line to hear. I'd come straight from the garden in my old green coat with the patch on the elbow. 🧥

    He called security and had me walked to the door. A few customers snickered.

    I just smiled and asked him for one small favor before I left. 🏦

