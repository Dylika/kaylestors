the-ledger-in-the-attic-episode-1:
  caption: |
    📖 NEW SERIES: The Ledger in the Attic (Episode 1 of 50)

    Grandma left me everything: the hardware store, the lake house, all of it. My uncle called me a manipulator. My mother said I always wanted to be her favorite.

    Then her lawyer handed me a sealed envelope in her handwriting:
    "Only after they've shown you who they are."

    And outside the window, a gray truck was waiting. Someone was watching me. 👀

    Episode 1 is in the comments 👇 New episodes every day.
  comment: |
